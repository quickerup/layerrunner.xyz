name = "layerrunner"
main = "src/worker.ts"
compatibility_date = "2025-01-15"
workers_dev = true
preview_urls = true

[[durable_objects.bindings]]
name = "APPROVALS"
class_name = "ApprovalStore"

[[durable_objects.bindings]]
name = "LEDGER"
class_name = "UserLedger"

[[migrations]]
tag = "v1-durable-approvals-ledger"
new_sqlite_classes = ["ApprovalStore", "UserLedger"]

[ai]
binding = "AI"

# Routes for domain
[[routes]]
pattern = "layerrunners.xyz/telegram/webhook"
zone_name = "layerrunners.xyz"

[[routes]]
pattern = "www.layerrunners.xyz/telegram/webhook"
zone_name = "layerrunners.xyz"

# Environment variables for different stages
[env.production]
name = "layerrunner-prod"
vars = { ENVIRONMENT = "production" }

[[env.production.durable_objects.bindings]]
name = "APPROVALS"
class_name = "ApprovalStore"

[[env.production.durable_objects.bindings]]
name = "LEDGER"
class_name = "UserLedger"

[[env.production.migrations]]
tag = "v1-durable-approvals-ledger"
new_sqlite_classes = ["ApprovalStore", "UserLedger"]

[env.production.ai]
binding = "AI"

[[env.production.routes]]
pattern = "layerrunners.xyz/auth/*"
zone_name = "layerrunners.xyz"

[[env.production.routes]]
pattern = "layerrunners.xyz/api/*"
zone_name = "layerrunners.xyz"

[[env.production.routes]]
pattern = "www.layerrunners.xyz/auth/*"
zone_name = "layerrunners.xyz"

[[env.production.routes]]
pattern = "www.layerrunners.xyz/api/*"
zone_name = "layerrunners.xyz"

[env.staging]
name = "layerrunner-staging"
vars = { ENVIRONMENT = "staging" }

[[env.staging.durable_objects.bindings]]
name = "APPROVALS"
class_name = "ApprovalStore"

[[env.staging.durable_objects.bindings]]
name = "LEDGER"
class_name = "UserLedger"

[[env.staging.migrations]]
tag = "v1-durable-approvals-ledger"
new_sqlite_classes = ["ApprovalStore", "UserLedger"]

[env.staging.ai]
binding = "AI"

[env.development]
name = "layerrunner-dev"
vars = { ENVIRONMENT = "development" }

[[env.development.durable_objects.bindings]]
name = "APPROVALS"
class_name = "ApprovalStore"

[[env.development.durable_objects.bindings]]
name = "LEDGER"
class_name = "UserLedger"

[[env.development.migrations]]
tag = "v1-durable-approvals-ledger"
new_sqlite_classes = ["ApprovalStore", "UserLedger"]

[env.development.ai]
binding = "AI"
